<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="prism-refraction-title prism-refraction-desc"><title id="prism-refraction-title">兩次折射與各自法線</title><desc id="prism-refraction-desc">各界面有自己的原方向延長線與偏轉箭頭。進入玻璃偏向法線①，離開玻璃偏離法線②；法線和折射光路按實際模型繪製。</desc><defs><marker id="prism-refraction-bend-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M1 1L11 6L1 11Z" fill="#a0f0cb"/></marker><radialGradient id="prism-refraction-mat"><stop stop-color="#466052"/><stop offset="1" stop-color="#203930"/></radialGradient><linearGradient id="prism-refraction-glass" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#c8f2e5" stop-opacity=".12"/><stop offset=".28" stop-color="#c5f9e6" stop-opacity=".34"/><stop offset=".6" stop-color="#9bccb8" stop-opacity=".13"/><stop offset="1" stop-color="#e0fff2" stop-opacity=".4"/></linearGradient><radialGradient id="prism-refraction-gleam"><stop stop-color="#e0fff5" stop-opacity=".36"/><stop offset="1" stop-color="#e0fff5" stop-opacity="0"/></radialGradient><filter id="prism-refraction-shadow" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="9"/></filter><filter id="prism-refraction-beam"><feGaussianBlur stdDeviation="2.5"/></filter><clipPath id="prism-refraction-clip"><polygon points="319.3291,412.8867 524.3111,442.1144 476.3598,44.9990"/></clipPath><pattern id="prism-refraction-grain" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 7L7 0" stroke="#e0eee4" stroke-opacity=".018" stroke-width=".6"/></pattern></defs><style>text{font:24px system-ui,sans-serif;fill:#d8e8df}.small{font-size:21px;fill:#b9cfc2}.heading{font-weight:650}.badge{font-size:21px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#f6ebca}</style><rect width="1000" height="650" rx="20" fill="url(#prism-refraction-mat)"/><rect x="1" y="1" width="998" height="648" rx="19" fill="url(#prism-refracti