name: Clear superseded Pages deployment after source switch

on: workflow_dispatch

permissions:
  actions: read
  pages: write

concurrency:
  group: pages-completed-record-repair
  cancel-in-progress: false

jobs:
  cancel-completed-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the completed old release and request its cancellation
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_STATE_REPO: ${{ github.repository }}
          PAGES_STATE_SHA: 609c9cfe0889d886c1193854a1a3c74a0322e326
        shell: bash
        run: |
          set -euo pipefail
          source_type=$(gh api "repos/${PAGES_STATE_REPO}/pages" --jq '.build_type')
          test "$source_type" = workflow
          old_run=$(gh api "repos/${PAGES_STATE_REPO}/actions/runs/41289128518" --jq '.head_sha + " " + .conclusion')
          test "$old_run" = "${PAGES_STATE_SHA} success"
          gh api --method POST "repos/${PAGES_STATE_REPO}/pages/deployments/${PAGES_STATE_SHA}/cancel"
          echo 'Cancellation request accepted for the confirmed superseded release.'
