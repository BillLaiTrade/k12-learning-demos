<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="prism-dispersion-title prism-dispersion-desc"><title id="prism-dispersion-title">色光分離放大的原理示意</title><desc id="prism-dispersion-desc">為了辨識色散，圖中放大代表色光的分離程度，非實際角度。白光在入射處分成三條可辨識路徑，再於出射面折射；紅光偏折較小、藍光較大。</desc><defs><radialGradient id="prism-dispersion-mat"><stop stop-color="#466052"/><stop offset="1" stop-color="#203930"/></radialGradient><linearGradient id="prism-dispersion-glass" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#c8f2e5" stop-opacity=".12"/><stop offset=".28" stop-color="#c5f9e6" stop-opacity=".34"/><stop offset=".6" stop-color="#9bccb8" stop-opacity=".13"/><stop offset="1" stop-color="#e0fff2" stop-opacity=".4"/></linearGradient><radialGradient id="prism-dispersion-gleam"><stop stop-color="#e0fff5" stop-opacity=".36"/><stop offset="1" stop-color="#e0fff5" stop-opacity="0"/></radialGradient><filter id="prism-dispersion-shadow" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="9"/></filter><filter id="prism-dispersion-beam"><feGaussianBlur stdDeviation="2.5"/></filter><clipPath id="prism-dispersion-clip"><polygon points="244.4130,438.7758 423.7722,464.3501 381.8148,116.8741"/></clipPath><pattern id="prism-dispersion-grain" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 7L7 0" stroke="#e0eee4" stroke-opacity=".018" stroke-width=".6"/></pattern></defs><style>text{font:24px system-ui,sans-serif;fill:#d8e8df}.small{font-size:21px;fill:#b9cfc2}.heading{font-weight:650}.badge{font-size:21px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#f6ebca}</style><rect width="1100" height="600" rx="20" fill="url(#prism-dispersion-mat)"/><rect x="1" y="1" width="1098" height="598" rx="19" fill="url(#prism-dispersion-grain)" stroke="#8ba996" stroke-opacity=".45"/><polygon points="248.4130,450.7758 427.7722,476.3501 385.8148,128.8741" fill="#061b18" opacity=".65" filter="url(#prism-dispersion-shadow)"/><polygon data-glass="" points="244.4130,438.7758 423.7722,464.3501 381.8148,116.8741" fill="url(#prism-dispersion-glass)" stroke="#a0d9c7" stroke-width="2"/><g clip-path="url(#prism-dispersion-clip)"><path d="M244.4130,438.7758L381.8148,116.8741" stroke="#d6fff3" stroke-width="18" opacity=".12"/><path d="M244.4130,438.7758L381.8148,116.8741" stroke="#e0fff8" stroke-width="5" opacity=".32"/><ellipse cx="350" cy="240" rx="65" ry="200" fill="url(#prism-dispersion-gleam)" transform="rotate(28 350 240)"/></g><polygon points="244.4130,438.7758 423.7722,464.3501 381.8148,116.8741" fill="none" stroke="#e3fff5" stroke-width="1" opacity=".85" transform="translate(-1,-1)"/><path d="M244.4130,438.7758L423.7722,464.3501" stroke="#9ed8c2" stroke-width="5" opacity=".3"/><path d="M40 340L286.5748,340.0000" stroke="#edf5ef" stroke-width="9" opacity=".09"/><path d="M40 340L286.5748,340.0000" stroke="#f3f5ed" stroke-width="2.5"/><path d="M40 340L286.5748,340.0000" stroke="#fff7db" stroke-width=".8"/><polyline data-light="red" data-wavelength="650" points="286.5748,340.0000 410.7220,356.2734 875.0000,473.5114" data-source-path="-210.0000,340.0000 286.5748,340.0000 410.8913,357.6747 875.0000,492.1275" data-separation-gain="28" fill="none" stroke="#ff776b" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/><polyline data-light="green" data-wavelength="530" points="286.5748,340.0000 411.1126,359.5074 875.0000,516.9237" data-source-path="-210.0000,340.0000 286.5748,340.0000 410.9052,357.7902 875.0000,493.6738" data-separation-gain="28" fill="none" stroke="#78e6b1" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/><polyline data-light="blue" data-wavelength="460" points="286.5748,340.0000 411.4892,362.6266 875.0000,560.5928" data-source-path="-210.0000,340.0000 286.5748,340.0000 410.9185,357.9000 875.0000,495.1575" data-separation-gain="28" fill="none" stroke="#79b4ff" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="54" class="heading">白光通過三稜鏡，色光逐漸分開</text><text data-ray-label="red" x="888" y="480.51139318619863" style="fill:#ff776b">紅光｜偏折較小</text><text data-ray-label="green" x="888" y="523.9236548010048" style="fill:#78e6b1">綠光</text><text data-ray-label="blue" x="888" y="567.5928385751793" style="fill:#79b4ff">藍光｜偏折較大</text><text x="54" y="190">空氣</text><text x="620" y="570">空氣</text><text x="321" y="435">玻璃</text><text x="325" y="525">底邊</text></svg>
