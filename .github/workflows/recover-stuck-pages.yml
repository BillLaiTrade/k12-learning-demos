name: Recover stuck Pages deployment

on: workflow_dispatch

permissions:
  pages: write

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Cancel the superseded deployment blocking publication
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RECOVERY_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/${PAGES_RECOVERY_REPO}/pages/deployments/44f42d94a19e166cf1f1d6d3f05f2d4a78798022/cancel"
