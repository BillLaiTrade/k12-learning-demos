<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" role="img" aria-labelledby="title desc"><title id="title">只調亮綠光，同一像素由橙變黃</title><desc id="desc">每一列橫向都是同一個像素的兩種觀看方式：左邊放大子像素，右邊是一般觀看距離合看的顏色，不是先後步驟。上列為調整前，下列為調整後；紅光與藍光保持不變，只提高綠光亮度，顏色由橙色變黃色。</desc><style>text{font:14px system-ui,sans-serif;fill:#36573e}path{fill:none;stroke-linecap:round;stroke-linejoin:round}.small{font-size:12px}.em{font-weight:700}</style><text x="123" y="19" text-anchor="middle" >近看子像素</text><text x="252" y="19" text-anchor="middle" >一般觀看</text><g data-state="before"><text x="35" y="57" text-anchor="middle" class="em">調整前</text><text x="35" y="77" text-anchor="middle" class="small">綠光較暗</text><rect x="76" y="37" width="96" height="56" fill="#26392b" rx="5"/><rect x="80" y="41" width="29" height="48" fill="rgb(255, 0, 0)" data-subpixel="0"/><rect x="110" y="41" width="29" height="48" fill="rgb(0, 137, 0)" data-subpixel="1"/><rect x="140" y="41" width="29" height="48" fill="rgb(0, 0, 0)" data-subpixel="2"/><text x="94" y="109" text-anchor="middle" class="small">紅 R</text><text x="124" y="109" text-anchor="middle" class="small">綠 G</text><text x="154" y="109" text-anchor="middle" class="small">藍 B</text><text x="195" y="72" text-anchor="middle" >＝</text><rect x="228" y="41" width="50" height="48" fill="rgb(255, 137, 0)" rx="5" stroke="#809775" data-combined="true"/><text x="253" y="109" text-anchor="middle" >橙色</text></g><path d="M124 116 V135 M119 129 L124 135 L129 129" stroke="#4d9760" stroke-width="2.5"/><g data-state="after"><text x="35" y="162" text-anchor="middle" class="em">調整後</text><text x="35" y="182" text-anchor="middle" class="small">綠光調亮</text><rect x="76" y="142" width="96" height="56" fill="#26392b" rx="5"/><rect x="80" y="146" width="29" height="48" fill="rgb(255, 0, 0)" data-subpixel="0"/><rect x="110" y="146" width="29" height="48" fill="rgb(0, 255, 0)" data-subpixel="1"/><rect x="140" y="146" width="29" height="48" fill="rgb(0, 0, 0)" data-subpixel="2"/><text x="94" y="214" text-anchor="middle" class="small">紅 R</text><text x="124" y="214" text-anchor="middle" class="small">綠 G</text><text x="154" y="214" text-anchor="middle" class="small">藍 B</text><text x="195" y="177" text-anchor="middle" >＝</text><rect x="228" y="146" width="50" height="48" fill="rgb(255, 255, 0)" rx="5" stroke="#809775" data-combined="true"/><text x="253" y="214" text-anchor="middle" >黃色</text></g></svg>
