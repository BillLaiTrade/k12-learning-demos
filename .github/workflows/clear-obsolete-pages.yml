name: Clear obsolete Pages deployment

on:
  workflow_dispatch:

permissions:
  pages: write
  actions: read

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the obsolete publisher is complete, then request Pages cancellation
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPAIR_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh api "repos/${PAGES_REPAIR_REPO}/actions/runs/41289128518" --jq '.status')
          test "$state" = completed
          gh api "repos/${PAGES_REPAIR_REPO}/pages/deployments/609c9cfe0889d886c1193854a1a3c74a0322e326"
          gh api --method POST "repos/${PAGES_REPAIR_REPO}/pages/deployments/609c9cfe0889d886c1193854a1a3c74a0322e326/cancel"
