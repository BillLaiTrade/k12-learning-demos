<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" role="img" aria-labelledby="prism-refraction-mobile-title prism-refraction-mobile-desc"><title id="prism-refraction-mobile-title">兩次折射與各自法線</title><desc id="prism-refraction-mobile-desc">各界面有自己的原方向延長線與偏轉箭頭。進入玻璃偏向法線①，離開玻璃偏離法線②；法線和折射光路按實際模型繪製。</desc><defs><marker id="prism-refraction-mobile-bend-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M1 1L11 6L1 11Z" fill="#a0f0cb"/></marker><radialGradient id="prism-refraction-mobile-mat"><stop stop-color="#466052"/><stop offset="1" stop-color="#203930"/></radialGradient><linearGradient id="prism-refraction-mobile-glass" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#c8f2e5" stop-opacity=".12"/><stop offset=".28" stop-color="#c5f9e6" stop-opacity=".34"/><stop offset=".6" stop-color="#9bccb8" stop-opacity=".13"/><stop offset="1" stop-color="#e0fff2" stop-opacity=".4"/></linearGradient><radialGradient id="prism-refraction-mobile-gleam"><stop stop-color="#e0fff5" stop-opacity=".36"/><stop offset="1" stop-color="#e0fff5" stop-opacity="0"/></radialGradient><filter id="prism-refraction-mobile-shadow" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="9"/></filter><filter id="prism-refraction-mobile-beam"><feGaussianBlur stdDeviation="2.5"/></filter><clipPath id="prism-refraction-mobile-clip"><polygon points="169.4968,354.6650 323.2333,376.5858 287.2699,78.7492"/></clipPath><pattern id="prism-refraction-mobile-grain" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 7L7 0" stroke="#e0eee4" stroke-opacity=".018" stroke-width=".6"/></pattern></defs><style>text{font:24px system-ui,sans-serif;fill:#d8e8df}.small{font-size:24px;fill:#b9cfc2}.heading{font-weight:650}.badge{font-size:21px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#f6ebca}</style><rect width="520" height="720" rx="20" fill="url(#prism-refraction-mobile-mat)"/><rect x="1" y="1" width="518" height="718" rx="19" fill="url(#prism-refraction-mobile-grain)" stroke="#8ba996" stroke-opacity=".45"/><polygon points="173.4968,366.6650 327.2333,388.5858 291.2699,90.7492" fill="#061b18" opacity=".65" filter="url(#prism-refraction-mobile-shadow)"/><polygon data-glass="" points="169.4968,354.6650 323.2333,376.5858 287.2699,78.7492" fill="url(#prism-refraction-mobile-glass)" stroke="#a0d9c7" stroke-width="2"/><g clip-path="url(#prism-refraction-mobile-clip)"><path d="M169.4968,354.6650L287.2699,78.7492" stroke="#d6fff3" stroke-width="18" opacity=".12"/><path d="M169.4968,354.6650L287.2699,78.7492" stroke="#e0fff8" stroke-width="5" opacity=".32"/><ellipse cx="260" cy="170" rx="45" ry="200" fill="url(#prism-refraction-mobile-gleam)" transform="rotate(28 260 170)"/></g><polygon points="169.4968,354.6650 323.2333,376.5858 287.2699,78.7492" fill="none" stroke="#e3fff5" stroke-width="1" opacity=".85" transform="translate(-1,-1)"/><path d="M169.4968,354.6650L323.2333,376.5858" stroke="#9ed8c2" stroke-width="5" opacity=".3"/><polyline data-normal="entry" points="277.3737,300.6210 133.8975,239.3790" stroke="#b3c6bc" stroke-width="1.5" stroke-dasharray="7 6" fill="none"/><polyline data-normal="exit" points="234.7604,294.5449 389.6354,275.8439" stroke="#b3c6bc" stroke-width="1.5" stroke-dasharray="7 6" fill="none"/><polyline data-forward-reference="entry" points="205.6356,270.0000 293.6356,270.0000" stroke="#a9bbb0" stroke-width="1.5" stroke-dasharray="7 6" fill="none"/><polyline data-forward-reference="exit" points="312.1979,285.1944 485.0000,309.8337" stroke="#a9bbb0" stroke-width="1.5" stroke-dasharray="7 6" fill="none"/><path d="M205.6356,270.0000 L281.6356,270.0000 A76 76 0 0 1 280.8746,280.7281Z" fill="#8ee8bc" opacity=".07"/><path d="M312.1979,285.1944 L465.6459,307.0741 A155 155 0 0 1 461.0209,328.5156Z" fill="#8ee8bc" opacity=".07"/><path d="M28 270L205.6356,270.0000" stroke="#e8bb64" stroke-width="9" opacity=".09"/><path d="M28 270L205.6356,270.0000" stroke="#edbd63" stroke-width="2.5"/><path d="M28 270L205.6356,270.0000" stroke="#fff7db" stroke-width=".8"/><g filter="url(#prism-refraction-mobile-beam)" opacity=".35"><polyline data-light="halo" data-wavelength="587.5618" points="205.6356,270.0000 312.1979,285.1944 488.0000,336.3690" fill="none" stroke="#dfb55e" stroke-width="2.8" stroke-linejoin="round" /></g><polyline data-light="reference" data-wavelength="587.5618" points="205.6356,270.0000 312.1979,285.1944 488.0000,336.3690" fill="none" stroke="#f2c66c" stroke-width="2.8" stroke-linejoin="round" /><path data-bend="entry" d="M281.6356,270.0000 A76 76 0 0 1 280.8746,280.7281" stroke="#a0f0cb" stroke-width="3.5" stroke-linecap="round" fill="none" marker-end="url(#prism-refraction-mobile-bend-arrow)"/><path data-bend="exit" d="M465.6459,307.0741 A155 155 0 0 1 461.0209,328.5156" stroke="#a0f0cb" stroke-width="3.5" stroke-linecap="round" fill="none" marker-end="url(#prism-refraction-mobile-bend-arrow)"/><path d="M189.63558413072974 247L205.63558413072974 270" stroke="#a5c9b6" stroke-width="1"/><circle cx="189.63558413072974" cy="233" r="15" fill="#1b352c" stroke="#a8d5c0"/><text class="badge" x="189.63558413072974" y="234">1</text><circle cx="205.63558413072974" cy="270" r="4" fill="#ffeac0"/><path d="M326.19789544188546 262.19438791939166L312.19789544188546 285.19438791939166" stroke="#a5c9b6" stroke-width="1"/><circle cx="326.19789544188546" cy="248.19438791939166" r="15" fill="#1b352c" stroke="#a8d5c0"/><text class="badge" x="326.19789544188546" y="249.19438791939166">2</text><circle cx="312.19789544188546" cy="285.19438791939166" r="4" fill="#ffeac0"/><text x="70" y="213">法線①</text><text x="373" y="235">法線②</text><rect x="25" y="440" width="470" height="78" rx="12" fill="#244839" stroke="#6da98c" stroke-opacity=".65"/><text x="43" y="471" class="heading" style="fill:#b9f2d4">① 入射：偏向法線</text><text x="43" y="500" class="small">由原方向轉近法線①</text><rect x="25" y="535" width="470" height="7