<svg xmlns="http://www.w3.org/2000/svg" width="850" height="390" viewBox="0 0 850 390" role="img" aria-labelledby="prism-refraction-title prism-refraction-desc">
<title id="prism-refraction-title">三稜鏡的兩次折射與兩條法線</title>
<desc id="prism-refraction-desc">光在入射處偏向該處法線，在出射處偏離另一條法線；兩個折射面不平行，出射方向與原本直行方向不同。</desc>
<defs><linearGradient id="prism-refraction-surface" x2=".8" y2="1"><stop stop-color="#e6e9df"/><stop offset="1" stop-color="#c7d0c3"/></linearGradient><linearGradient id="prism-refraction-glass" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#e6fff5" stop-opacity=".75"/><stop offset=".35" stop-color="#bddfd0" stop-opacity=".28"/><stop offset=".65" stop-color="#ecfff7" stop-opacity=".65"/><stop offset="1" stop-color="#70a38f" stop-opacity=".3"/></linearGradient><filter id="prism-refraction-shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="5"/></filter></defs>
<style>text{font:20px system-ui,sans-serif;fill:#334c41}.number{font-size:22px;font-weight:700}@media(max-width:500px){text{font-size:31px}.number{font-size:28px}}</style>
