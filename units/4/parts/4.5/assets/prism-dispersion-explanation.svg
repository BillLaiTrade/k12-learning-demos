<svg xmlns="http://www.w3.org/2000/svg" width="850" height="390" viewBox="0 0 850 390" role="img" aria-labelledby="prism-dispersion-title prism-dispersion-desc">
<title id="prism-dispersion-title">同一塊玻璃中的紅、綠、藍代表光路</title>
<desc id="prism-dispersion-desc">三種色光沿同一方向入射，在進出玻璃的界面分別折射。紅光偏折較小、藍光較大；圖中的細微差異與主實驗使用相同模型；右上局部圖使用相同兩軸倍率放大觀看，沒有放大角差。</desc>
<defs><linearGradient id="prism-dispersion-surface" x2=".8" y2="1"><stop stop-color="#e6e9df"/><stop offset="1" stop-color="#c7d0c3"/></linearGradient><linearGradient id="prism-dispersion-glass" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#e6fff5" stop-opacity=".75"/><stop offset=".35" stop-color="#bddfd0" stop-opacity=".28"/><stop offset=".65" stop-color="#ecfff7" stop-opacity=".65"/><stop offset="1" stop-color="#70a38f" stop-opacity=".3"/></linearGradient><filter id="prism-dispersion-shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="5"/></filter></defs>
<style>text{font:20px system-ui,sans-serif;fill:#334c41}.number{font-size:22px;font-weight:700}@media(max-width:500px){text{font-size:31px}.number{font-size:28px}}</style>
<rect width="850" height="390" rx="18" fill="url(#prism-dispersion-surface)"/><polygon points="274.5807,285.5542 402.6944,303.8215 372.7249,55.6243" fill="#254c4140" filter="url(#prism-dispersion-shadow)"/><polygon points="274.5807,280.5542 402.6944,298.8215 372.7249,50.6243" fill="url(#prism-dispersion-glass)" stroke="#6ba68e" stroke-width="1.5"/><polygon points="274.5807,280.5542 402.6944,298.8215 372.7249,50.6243" fill="none" stroke="#f2fff8" stroke-width="3" stroke-linejoin="round" transform="translate(-1,-1)" opacity=".7"/><path d="M274.5807,280.5542 L402.6944,298.8215" stroke="#487966" stroke-width="5" opacity=".28"/><path d="M25.0000,210.0000 L304.6963,210.0000" stroke="#fffef3" stroke-width="2.5" fill="none"/><path d="M25.0000,210.0000 L304.6963,210.0000" stroke="#8b7039" stroke-width="7" opacity=".13" fill="none"/><polyline data-light="red" data-wavelength="650" points="304.6963,210.0000 393.4938,222.6248 850.0000,354.8751" fill="none" stroke="#c84c3d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="miter"/><polyline data-light="green" data-wavelength="530" points="304.6963,210.0000 393.5037,222.7073 850.0000,356.3661" fill="none" stroke="#278561" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="miter"/><polyline data-light="blue" data-wavelength="460" points="304.6963,210.0000 393.5132,222.7857 850.0000,357.7970" fill="none" stroke="#3677bf" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="miter"/><text x="550" y="38">出射光局部近看</text><rect x="550" y="50" width="260" height="150" rx="12" fill="#f7faf2" stroke="#8fa394"/><polyline data-zoom-light="red" points="570.0000,61.0731 765.0000,117.5648" fill="none" stroke="#c84c3d" stroke-width="2"/><polyline data-zoom-light="green" points="570.0000,89.5441 765.0000,146.6387" fill="none" stroke="#278561" stroke-width="2"/><polyline data-zoom-light="blue" points="570.0000,116.8678 765.0000,174.5413" fill="none" stroke="#3677bf" stroke-width="2"/>
