name: Recover Pages publishing source

on: workflow_dispatch

permissions:
  pages: write

jobs:
  select-actions-source:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Use the existing Actions publisher instead of competing branch builds
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RECOVERY_REPO: ${{ github.repository }}
        run: gh api --method PUT "repos/${PAGES_RECOVERY_REPO}/pages" -f build_type=workflow
