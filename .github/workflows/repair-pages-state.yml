name: Repair superseded Pages deployment state

on:
  workflow_dispatch:

permissions:
  pages: write
  deployments: write

concurrency:
  group: pages-state-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Retire the completed deployment blocking newer builds
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPAIR_REPO: ${{ github.repository }}
          PAGES_REPAIR_SHA: 44f42d94a19e166cf1f1d6d3f05f2d4a78798022
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${PAGES_REPAIR_REPO}/deployments?sha=${PAGES_REPAIR_SHA}&environment=github-pages&per_page=100" --jq '.[].id' > /tmp/pages-superseded-deployments
          while IFS= read -r deployment_id; do
            gh api --method POST "repos/${PAGES_REPAIR_REPO}/deployments/${deployment_id}/statuses" \
              -f state=inactive \
              -f description='Superseded completed Pages deployment; current main must publish.' \
              --jq '{id,state}'
          done < /tmp/pages-superseded-deployments
          gh api "repos/${PAGES_REPAIR_REPO}/pages/deployments/${PAGES_REPAIR_SHA}"
      - name: Request the configured branch publisher to rebuild current main
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_REPAIR_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/${PAGES_REPAIR_REPO}/pages/builds"
