<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>物質、分離與水溶液</title>
  <style>
    :root { color-scheme: light; --ink:#243a35; --muted:#64736d; --paper:#f4f1e8; --card:#fffdf8; --line:#d9d3c4; --green:#176b53; --gold:#d7a94a; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif; line-height:1.7; }
    .shell { width:min(1080px,calc(100% - 36px)); margin-inline:auto; }
    .masthead { padding:34px 0 28px; }
    .eyebrow { color:var(--green); font-size:.78rem; font-weight:800; letter-spacing:.12em; }
    h1,h2,h3,p { margin-top:0; }
    h1 { max-width:760px; margin:8px 0 14px; font-size:clamp(2rem,5vw,3.4rem); line-height:1.22; letter-spacing:-.04em; }
    .intro { max-width:730px; color:#52635d; font-size:1.08rem; }
    .part-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; padding:10px 0 48px; }
    .part-card { min-height:230px; padding:22px; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 7px 20px #243a3508; }
    .part-card.active { border:2px solid #9b7c37; }
    .part-number { width:max-content; padding:2px 10px; border-radius:999px; background:#efe6cd; color:#594a28; font-size:.78rem; font-weight:800; }
    .part-card h2 { margin:16px 0 8px; font-size:1.25rem; line-height:1.45; }
    .part-card p { color:var(--muted); font-size:.93rem; }
    .part-card a { margin-top:auto; width:max-content; color:#fff; background:var(--green); padding:9px 15px; border-radius:10px; font-weight:750; text-decoration:none; }
    .planned { margin-top:auto; color:#77827c; font-size:.82rem; }
    footer { padding:18px 0 28px; color:#718078; font-size:.82rem; }
    @media(max-width:720px) { .part-list { grid-template-columns:1fr; } .part-card { min-height:190px; } }
  </style>
</head>
<body>
  <header class="shell masthead">
    <div class="eyebrow">國二上・自然科學</div>
    <h1>物質、分離與水溶液</h1>
    <p class="intro">從辨認材料與混合物開始，接著學習如何分離混合物，最後認識水溶液中的溶質含量。</p>
  </header>
  <main class="shell">
    <div class="eyebrow">從這裡開始</div>
    <section class="part-list" aria-label="學習內容">
      <article class="part-card active">
        <span class="part-number">第一段</span>
        <h2>雨水桶裡的水變混濁了，裡面到底有什麼？</h2>
        <p>從雨水桶和花圃水樣出發，觀察物質的狀態與性質，運用證據判斷樣本由什麼組成。</p>
        <a href="parts/4.1/index.html">開始探索</a>
      </article>
      <article class="part-card">
        <span class="part-number">第二段</span>
        <h2>內容規劃中</h2>
        <p>這一段的卡片與標題尚待討論確認，完成後會接續開放。</p>
        <span class="planned">尚未開放</span>
      </article>
      <article class="part-card">
        <span class="part-number">第三段</span>
        <h2>內容規劃中</h2>
        <p>這一段的卡片與標題尚待討論確認，完成後會接續開放。</p>
        <span class="planned">尚未開放</span>
      </article>
    </section>
  </main>
  <footer class="shell">國二上・自然科學</footer>
</body>
</html>
