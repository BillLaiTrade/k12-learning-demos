<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200" role="img" aria-labelledby="title desc"><title id="title">一個像素內的RGB子像素</title><desc id="desc">同一個橙色像素的兩種視角。近看是緊密排列的紅、綠、藍子像素；紅亮、綠較暗、藍關閉。一般觀看距離會合看成一個橙色。這裡不是三個獨立的像素。</desc><style>text{font:13px system-ui,sans-serif;fill:#416044}path{fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="77" y="27" text-anchor="middle">近看：三個子像素</text><text x="242" y="27" text-anchor="middle">合看：一個顏色</text><rect x="19" y="60" width="117" height="88" fill="#25372c" rx="8"/><rect x="25" y="66" width="34" height="76" fill="rgb(255, 0, 0)" data-subpixel="0"/><rect x="60" y="66" width="34" height="76" fill="rgb(0, 137, 0)" data-subpixel="1"/><rect x="95" y="66" width="34" height="76" fill="rgb(0, 0, 0)" data-subpixel="2"/><text x="42" y="169" text-anchor="middle">紅 R</text><text x="77" y="169" text-anchor="middle">綠 G</text><text x="112" y="169" text-anchor="middle">藍 B</text><path d="M153 103 H193 M185 97 L193 103 L185 109" stroke="#82a27a" stroke-width="2.5"/><rect x="213" y="65" width="59" height="77" fill="rgb(255, 137, 0)" rx="8" stroke="#859b7c" stroke-width="1.5" data-combined="true"/></svg>
