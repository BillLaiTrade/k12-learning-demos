<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">設定相同，觀看距離改變可分辨的細節</title><desc id="desc">上下兩景使用同一個螢幕區域、相同的RGB亮度設定。上景眼睛靠近或放大觀察，可分辨子像素；下景眼睛離螢幕較遠，在一般觀看距離難以分開密集的小色光，合看為橙色。距離線下景比上景長，沒有等號或時間變化箭頭。</desc><style>text{font:18px system-ui,sans-serif;fill:#36573e}path{fill:none;stroke-linecap:round;stroke-linejoin:round}.small{font-size:16px}.strong{font-weight:700}.channel{font-size:15px}</style><text x="44" y="25" text-anchor="middle" class="small">螢幕</text><text x="244" y="25" text-anchor="middle" class="small">看到的細節</text><rect x="15" y="45" width="57" height="58" fill="#293b2e" rx="4"/><rect x="25" y="55" width="2" height="11" fill="rgb(255, 0, 0)" /><rect x="27" y="55" width="2" height="11" fill="rgb(0, 137, 0)" /><rect x="29" y="55" width="2" height="11" fill="rgb(0, 0, 0)" /><rect x="31" y="55" width="2" height="11" fill="rgb(255, 0, 0)" /><rect x="33" y="55" width="2" height="11" fill="rgb(0, 137, 0)" /><rect x="35" y="55" width="2" height="11" fill="rgb(0, 0, 0)" /><rect x="37" y="55" width="2" height="11" fill="rgb(255, 0, 0)" /><rect x="39" y="55" width="2" height="11" fill="rgb(0, 137, 0)" /><rect x="41" y="55" width="2" height="11" fill="rgb(0, 0, 0)" /><rect x="43" y="55" width="2" height="11" fill="rgb(255, 0, 0)" /><rect x="45" y="55" width="2" height="11" fill="rgb(0, 137, 0)" /><rect x="47" y="55" width="2" height="11" fill="rgb(0, 0, 0)" /><rect x="49" y="55" width="2" height="11" fill="rgb(255, 0, 0)" /><rect x="51" y="55" width="2" height="11" fill="rgb(0, 137, 0)" /><rect x="53" y="55" width="2" height="11" fill="rgb(0, 0, 0)" /><rect x="55" y="55" width="2" height="11" fill="rgb(255, 0, 0)" /><rect x="57" y="55" width="2" height="11" fill="rgb(0, 137, 0)" /><rect x="59" y="55" width="2" height="11" fill="rgb(0, 0, 0)" /><rect x="25" y="67" width="2" height="11" fill="rgb(255, 0, 0)" /><rect x="27" y="67" width="2" height="11" fill="rgb(0, 137, 0)" /><rect x="