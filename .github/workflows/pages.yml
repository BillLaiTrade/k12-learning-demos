name: Deploy demo page

on:
  # Pages currently publishes main through its branch build. Keep this workflow
  # manual so each push has one publisher instead of two competing deployments.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-main-manual
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out demo page
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish the page
        id: deployment
        uses: actions/deploy-pages@v4
